[package]
edition = "2024"
rust-version = "1.92.0"
name = "jpegxl-sys"
version = "0.13.0+libjxl-0.13.0"
build = "build.rs"
links = "jxl"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
publish = false
description = "Rust wrapper for JPEG XL reference implementation"
keywords = ["jpeg-xl","jxl"]
categories = ["external-ffi-bindings", "encoding", "multimedia::images"]
license = "GPL-3.0-or-later"
repository = "https://github.com/inflation/jpegxl-rs"

[features]
default = []
docs = []
vendored = ["dep:jpegxl-src"]

[lib]
name = "jpegxl_sys"
path = "src/lib.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pretty_assertions = "1.4.1"

[build-dependencies]
pkg-config = "0.3"
jpegxl-src = { version = "0.13.0", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }