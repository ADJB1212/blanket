[package]
edition = "2024"
rust-version = "1.92.0"
name = "jpegxl-rs"
version = "0.16.0+libjxl-0.13.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
publish = false
description = "Safe Rust wrapper for JPEG XL reference implementation"
keywords = ["jpeg-xl", "jxl"]
categories = ["api-bindings", "encoding", "multimedia::images"]
license = "GPL-3.0-or-later"
repository = "https://github.com/inflation/jpegxl-rs"

[features]
bench = []
default = ["image"]
image = ["dep:image"]
vendored = ["jpegxl-sys/vendored"]

[lib]
name = "jpegxl_rs"
path = "src/lib.rs"
bench = false

[dependencies]
image = { version = "0.25", optional = true, default-features = false }
thiserror = "2.0.18"
half = "2.7.1"
byteorder = "1.5.0"
bon = "3.9.1"
jpegxl-sys = { version = "0.13.0", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lcms2 = "6.1.1"
pretty_assertions = "1.4.1"
testresult = "0.4.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }