[package]
edition = "2024"
name = "flo_curves"
version = "0.3.1"
authors = ["Andrew Hunter"]
description = "Library for manipulating Bezier curves"
documentation = "http://docs.rs/flo_curves/"
keywords = ["bezier", "geometry", "graphics"]
categories = ["algorithms", "rendering"]
license = "Apache-2.0"
repository = "https://github.com/Logicalshift/flo_curves"

[features]
extra_checks = []

[dependencies]
itertools = { version = "0.14", default-features = false, features = ["use_std"] }
roots = "0.0.8"
smallvec = { version = "1", default-features = false, features = ["const_generics"] }

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(extra_checks)'] }
unused_imports = "allow"