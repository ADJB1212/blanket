[package]
edition = "2024"
rust-version = "1.98"
name = "png"
version = "0.18.1"
authors = ["The image-rs Developers"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
publish = false
description = "PNG decoding and encoding library in pure Rust"
categories = ["multimedia::images"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/image-rs/image-png"

[features]
benchmarks = []
unstable = ["crc32fast/nightly"]
zlib-rs = ["flate2/zlib-rs"]

[lib]
name = "png"
path = "src/lib.rs"

[dependencies]
bitflags = { version = "2", default-features = false }
crc32fast = { version = "1", default-features = false, features = ["std", "nightly"] }
fdeflate = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend", "zlib-rs"] }

[dev-dependencies]
approx = "0.5.1"
byteorder = "1.5.0"
glob = "0.3"
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
dead_code = "allow"
