name: Benchmark-x86

on:
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev libheif-dev libde265-dev libx265-dev libnuma-dev clang llvm lld ninja-build
      - name: Setup PATH
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - uses: ilammy/setup-nasm@v1
        with:
          version: 3.02
      - name: Install project and benchmark dependencies
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C target-cpu=x86-64-v2 -C link-arg=-Wl,-O1"
          CFLAGS: "-O3 -march=native"
          CXXFLAGS: "-O3 -march=native"
        run: |
          uv python install 3.14
          uv sync --no-install-project --extra test
          uv tool install maturin
          maturin develop --extras test --uv -r
      - name: Run benchmarks
        run: uv run --no-sync scripts/benchmark.py --all -v --no-baseline -w 2 -i 8
