name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created at the selected workflow commit if missing)
        required: true
        type: string

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  RUST_BACKTRACE: "1"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"
  UV_NO_SYNC: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ASK: "1"
  HOMEBREW_NO_DEPRECATED_WARNINGS: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      aom-version: ${{ steps.versions.outputs.aom }}
      x265-version: ${{ steps.versions.outputs.x265 }}
      libde265-version: ${{ steps.versions.outputs.libde265 }}
      dav1d-version: ${{ steps.versions.outputs.dav1d }}
      libheif-version: ${{ steps.versions.outputs.libheif }}
      libwebp-version: ${{ steps.versions.outputs.libwebp }}
    steps:
      - name: Set codec versions
        id: versions
        run: |
          echo "aom=v3.15.1" >> "$GITHUB_OUTPUT"
          echo "x265=4.2" >> "$GITHUB_OUTPUT"
          echo "libde265=v1.1.3" >> "$GITHUB_OUTPUT"
          echo "dav1d=1.5.4" >> "$GITHUB_OUTPUT"
          echo "libheif=v1.23.5" >> "$GITHUB_OUTPUT"
          echo "libwebp=v1.6.0" >> "$GITHUB_OUTPUT"
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAG:?A release tag is required}"
          : "${GITHUB_REPOSITORY:?A repository is required}"
          : "${GITHUB_SHA:?A workflow commit is required}"

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            exit 0
          fi

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes ""

  aom:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    uses: ./.github/workflows/build-aom.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.aom-version }}

  x265:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    uses: ./.github/workflows/build-x265.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.x265-version }}

  libde265:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    uses: ./.github/workflows/build-libde265.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libde265-version }}

  dav1d:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    uses: ./.github/workflows/build-dav1d.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.dav1d-version }}

  libheif:
    needs: [prepare, aom, x265, libde265, dav1d]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    uses: ./.github/workflows/build-libheif.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libheif-version }}
      aom-version: ${{ needs.prepare.outputs.aom-version }}
      x265-version: ${{ needs.prepare.outputs.x265-version }}
      libde265-version: ${{ needs.prepare.outputs.libde265-version }}
      dav1d-version: ${{ needs.prepare.outputs.dav1d-version }}

  libwebp:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    uses: ./.github/workflows/build-libwebp.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libwebp-version }}

  linux:
    needs: [prepare, libheif, libwebp]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Restore Rust Cache
        id: rust-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-source-codecs-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.libwebp-version }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Install Python from uv
        run: |
          uv python install 3.14
          uv tool install 'maturin[patchelf]>=1.15,<2'
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libnuma-dev mold
          brew install llvm lld cmake meson nasm ninja pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-O3" >> "$GITHUB_ENV"
      - name: Restore aom
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/aom
          key: aom-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.aom-version }}
          fail-on-cache-miss: true
      - name: Restore x265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/x265
          key: x265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.x265-version }}
          fail-on-cache-miss: true
      - name: Restore libde265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libde265
          key: libde265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libde265-version }}
          fail-on-cache-miss: true
      - name: Restore dav1d
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/dav1d
          key: dav1d-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libheif
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libheif
          key: libheif-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libwebp
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libwebp
          key: libwebp-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libwebp-version }}
          fail-on-cache-miss: true
      - name: Setup codec paths
        run: |
          echo "PKG_CONFIG_PATH=$HOME/deps/dav1d/lib/pkgconfig:$HOME/deps/aom/lib/pkgconfig:$HOME/deps/x265/lib/pkgconfig:$HOME/deps/libde265/lib/pkgconfig:$HOME/deps/libheif/lib/pkgconfig:$HOME/deps/libwebp/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/deps/dav1d:$HOME/deps/aom:$HOME/deps/x265:$HOME/deps/libde265:$HOME/deps/libheif:$HOME/deps/libwebp" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib" >> "$GITHUB_ENV"
      - name: Verify codec versions
        run: |
          pkg-config --modversion dav1d
          pkg-config --modversion aom
          pkg-config --modversion x265
          pkg-config --modversion libde265
          pkg-config --modversion libheif
          pkg-config --modversion libwebp
      - name: Build wheels
        id: build-wheel
        env:
          TUNE_ARGS: >-
            ${{ case(
              runner.arch == 'X64', '-C target-cpu=x86-64-v2',
              runner.arch == 'ARM64', '-C target-cpu=generic',
              ''
            ) }}
        run: |
          uv sync --no-install-project --only-group test
          maturin build --release --out dist --features vendored,user-provided-webp -i python3.14 --strip --target ${{ matrix.target }} --compatibility manylinux_2_39 --auditwheel=repair -- -C link-arg=-fuse-ld=mold -C link-arg=-Wl,-O3 $TUNE_ARGS
      - name: Save Rust Cache
        if: steps.rust-cache-restore.outputs.cache-hit != 'true' && steps.build-wheel.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}
      - name: Install and verify wheels
        run: |
          uv pip install --compile-bytecode dist/*.whl
          uv run scripts/verify_behavior.py
          uv run pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    needs: [prepare, libheif, libwebp]
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Restore Rust Cache
        id: rust-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-codecs-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.libwebp-version }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Install Python from uv
        run: |
          uv python install 3.14
          uv tool install maturin
          uv tool install delocate
      - name: Install build tools
        run: |
          brew install llvm lld cmake ninja nasm pkg-config
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-O3" >> "$GITHUB_ENV"
      - name: Restore aom
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/aom
          key: aom-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.aom-version }}
          fail-on-cache-miss: true
      - name: Restore x265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/x265
          key: x265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.x265-version }}
          fail-on-cache-miss: true
      - name: Restore libde265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libde265
          key: libde265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libde265-version }}
          fail-on-cache-miss: true
      - name: Restore dav1d
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/dav1d
          key: dav1d-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libheif
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libheif
          key: libheif-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libwebp
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libwebp
          key: libwebp-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libwebp-version }}
          fail-on-cache-miss: true
      - name: Setup codec paths
        run: |
          echo "PKG_CONFIG_PATH=$HOME/deps/dav1d/lib/pkgconfig:$HOME/deps/aom/lib/pkgconfig:$HOME/deps/x265/lib/pkgconfig:$HOME/deps/libde265/lib/pkgconfig:$HOME/deps/libheif/lib/pkgconfig:$HOME/deps/libwebp/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/deps/dav1d:$HOME/deps/aom:$HOME/deps/x265:$HOME/deps/libde265:$HOME/deps/libheif:$HOME/deps/libwebp" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib" >> "$GITHUB_ENV"
      - name: Verify codec versions
        run: |
          pkg-config --modversion dav1d
          pkg-config --modversion aom
          pkg-config --modversion x265
          pkg-config --modversion libde265
          pkg-config --modversion libheif
          pkg-config --modversion libwebp
      - name: Build wheels
        id: build-wheel
        run: |
          uv sync --no-install-project --only-group test
          maturin build --release --out dist-unrepaired --features vendored,user-provided-webp -i python3.14 --strip --auditwheel=skip -- -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O3 -C target-cpu=apple-m1
      - name: Save Rust Cache
        if: steps.rust-cache-restore.outputs.cache-hit != 'true' && steps.build-wheel.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}
      - name: Repair macOS wheels
        run: delocate-wheel --require-archs=arm64 -v -w dist dist-unrepaired/*.whl
      - name: Install and verify wheels
        run: |
          uv pip install --compile-bytecode dist/*.whl
          uv run scripts/verify_behavior.py
          uv run pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: dist/*.whl

  sdist:
    needs: prepare
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    needs: [linux, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
