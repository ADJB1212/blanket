name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created at the selected workflow commit if missing)
        required: true
        type: string

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  RUST_BACKTRACE: "1"
  PYTHONFAULTHANDLER: "1"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAG:?A release tag is required}"
          : "${GITHUB_REPOSITORY:?A repository is required}"
          : "${GITHUB_SHA:?A workflow commit is required}"

          # Create the ref explicitly: a draft release need not materialize its tag.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            exit 0
          fi

          # Keep new releases as drafts until they are explicitly published.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes ""

  linux:
    needs: prepare
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      DAV1D_VERSION: "1.5.4"
      AOM_VERSION: "v3.15.0"
      X265_VERSION: "4.2"
      LIBDE265_VERSION: "v1.1.3"
      LIBHEIF_VERSION: "v1.23.4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Restore Rust Cache
        id: rust-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

      - name: Install Python from uv
        run: |
          uv python install 3.14
          uv tool install 'maturin[patchelf]>=1.15,<2'

      - name: Install Deps
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y libnuma-dev clang-23 llvm-23 lld-23 ninja-build cmake meson pkg-config mold

      - name: Setup PATH
        run: |
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo "CC=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang-23" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
          echo "CFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS=-O3 ${CMAKE_CXX_FLAGS:-}" >> "$GITHUB_ENV"
          echo "CMAKE_C_FLAGS=-O3 ${CMAKE_C_FLAGS:-}" >> "$GITHUB_ENV"

      - uses: ilammy/setup-nasm@v1
        with:
          version: 3.02

      - name: Cache x265
        id: cache-x265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/x265
          key: x265-${{ runner.os }}-${{ matrix.target }}-${{ env.X265_VERSION }}

      - name: Build x265
        id: build-x265
        if: steps.cache-x265.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch "$X265_VERSION" \
            --depth 1 \
            https://bitbucket.org/multicoreware/x265_git.git \
            "$RUNNER_TEMP/x265"

          # Build private high-bit-depth encoders for the shared 8-bit dispatcher.
          # These static archives need PIC because they become part of libx265.so.
          for depth in 12 10; do
            cmake \
              -S "$RUNNER_TEMP/x265/source" \
              -B "$RUNNER_TEMP/x265/build-$depth" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DHIGH_BIT_DEPTH=ON \
              -DENABLE_HDR10_PLUS=ON \
              -DMAIN12="$([ "$depth" = 12 ] && echo ON || echo OFF)" \
              -DEXPORT_C_API=OFF \
              -DENABLE_SHARED=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DENABLE_CLI=OFF
            cmake --build "$RUNNER_TEMP/x265/build-$depth" --parallel
          done

          cmake \
            -S "$RUNNER_TEMP/x265/source" \
            -B "$RUNNER_TEMP/x265/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/deps/x265" \
            -DENABLE_SHARED=ON \
            -DENABLE_CLI=OFF \
            -DHIGH_BIT_DEPTH=OFF \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -DEXTRA_LIB="$RUNNER_TEMP/x265/build-10/libx265.a;$RUNNER_TEMP/x265/build-12/libx265.a"

          cmake --build "$RUNNER_TEMP/x265/build" --parallel
          cmake --install "$RUNNER_TEMP/x265/build"

      - name: Save x265 Cache
        if: steps.cache-x265.outputs.cache-hit != 'true' && steps.build-x265.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/deps/x265
          key: ${{ steps.cache-x265.outputs.cache-primary-key }}

      - name: Cache dav1d
        id: cache-dav1d
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/dav1d
          key: dav1d-${{ runner.os }}-${{ matrix.target }}-${{ env.DAV1D_VERSION }}

      - name: Build dav1d
        id: build-dav1d
        if: steps.cache-dav1d.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch "$DAV1D_VERSION" \
            --depth 1 \
            https://github.com/videolan/dav1d.git \
            "$RUNNER_TEMP/dav1d"

          meson setup \
            "$RUNNER_TEMP/dav1d/build" \
            "$RUNNER_TEMP/dav1d" \
            -Denable_tools=false \
            -Denable_tests=false \
            -Denable_docs=false \
            --prefix="$HOME/deps/dav1d" \
            --buildtype=release \
            --default-library=shared

          ninja -C "$RUNNER_TEMP/dav1d/build" install

      - name: Save dav1d Cache
        if: steps.cache-dav1d.outputs.cache-hit != 'true' && steps.build-dav1d.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/deps/dav1d
          key: ${{ steps.cache-dav1d.outputs.cache-primary-key }}

      - name: Cache AOM
        id: cache-aom
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/aom
          key: aom-${{ runner.os }}-${{ matrix.target }}-${{ env.AOM_VERSION }}

      - name: Build AOM
        id: build-aom
        if: steps.cache-aom.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch "$AOM_VERSION" \
            --depth 1 \
            https://aomedia.googlesource.com/aom \
            "$RUNNER_TEMP/aom"

          cmake \
            -S "$RUNNER_TEMP/aom" \
            -B "$RUNNER_TEMP/aom/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/deps/aom" \
            -DBUILD_SHARED_LIBS=1 \
            -DENABLE_TESTS=0 \
            -DENABLE_EXAMPLES=0 \
            -DENABLE_DOCS=0

          cmake --build "$RUNNER_TEMP/aom/build" --parallel
          cmake --install "$RUNNER_TEMP/aom/build"

      - name: Save aom Cache
        if: steps.cache-aom.outputs.cache-hit != 'true' && steps.build-aom.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/deps/aom
          key: ${{ steps.cache-aom.outputs.cache-primary-key }}

      - name: Cache libde265
        id: cache-libde265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libde265
          key: libde265-${{ runner.os }}-${{ matrix.target }}-${{ env.LIBDE265_VERSION }}

      - name: Build libde265
        id: build-libde265
        if: steps.cache-libde265.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch "$LIBDE265_VERSION" \
            --depth 1 \
            https://github.com/strukturag/libde265.git \
            "$RUNNER_TEMP/libde265"

          cmake \
            -S "$RUNNER_TEMP/libde265" \
            -B "$RUNNER_TEMP/libde265/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_DECODER=off \
            -DENABLE_SHERLOCK265=off \
            -DCMAKE_INSTALL_PREFIX="$HOME/deps/libde265"

          cmake --build "$RUNNER_TEMP/libde265/build" --parallel
          cmake --install "$RUNNER_TEMP/libde265/build"

      - name: Save libde265 Cache
        if: steps.cache-libde265.outputs.cache-hit != 'true' && steps.build-libde265.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/deps/libde265
          key: ${{ steps.cache-libde265.outputs.cache-primary-key }}

      - name: Cache libheif
        id: cache-libheif
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libheif
          key: libheif-${{ runner.os }}-${{ matrix.target }}-${{ env.LIBHEIF_VERSION }}

      - name: Build libheif
        id: build-libheif
        if: steps.cache-libheif.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch "$LIBHEIF_VERSION" \
            --depth 1 \
            https://github.com/strukturag/libheif.git \
            "$RUNNER_TEMP/libheif"

          cmake --preset=release-noplugins \
            -S "$RUNNER_TEMP/libheif" \
            -B "$RUNNER_TEMP/libheif/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/deps/libheif" \
            -DWITH_DAV1D=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_MULTITHREADING_SUPPORT=ON \
            -DENABLE_PARALLEL_TILE_DECODING=ON \
            -DWITH_LIBSHARPYUV=OFF \
            -DWITH_X264=OFF \
            -DBUILD_TESTING=OFF \
            -DWITH_EXAMPLES=OFF \
            -DBUILD_DOCUMENTATION=OFF \
            -DWITH_EXAMPLE_HEIF_THUMB=OFF \
            -DWITH_EXAMPLE_HEIF_VIEW=OFF \
            -DWITH_GDK_PIXBUF=OFF \
            -DBUILD_TESTING=OFF \
            -DLIBDE265_INCLUDE_DIR="$HOME/deps/libde265/include" \
            -DLIBDE265_LIBRARY="$HOME/deps/libde265/lib/libde265.so" \
            -DX265_INCLUDE_DIR="$HOME/deps/x265/include" \
            -DX265_LIBRARY="$HOME/deps/x265/lib/libx265.so" \
            -DDAV1D_INCLUDE_DIR="$HOME/deps/dav1d/include" \
            -DDAV1D_LIBRARY="$HOME/deps/dav1d/lib/x86_64-linux-gnu/libdav1d.so" \
            -DAOM_INCLUDE_DIR="$HOME/deps/aom/include" \
            -DAOM_LIBRARY="$HOME/deps/aom/lib/libaom.so"

          cmake --build "$RUNNER_TEMP/libheif/build" --parallel
          cmake --install "$RUNNER_TEMP/libheif/build"

      - name: Save libheif Cache
        if: steps.cache-libheif.outputs.cache-hit != 'true' && steps.build-libheif.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/deps/libheif
          key: ${{ steps.cache-libheif.outputs.cache-primary-key }}

      - name: Setup codec dependencies
        run: |
          echo "$HOME/deps/dav1d/bin" >> "$GITHUB_PATH"
          echo "$HOME/deps/aom/bin" >> "$GITHUB_PATH"
          echo "$HOME/deps/x265/bin" >> "$GITHUB_PATH"
          echo "$HOME/deps/libde265/bin" >> "$GITHUB_PATH"
          echo "$HOME/deps/libheif/bin" >> "$GITHUB_PATH"

          echo "PKG_CONFIG_PATH=$HOME/deps/dav1d/lib/x86_64-linux-gnu/pkgconfig:$HOME/deps/aom/lib/pkgconfig:$HOME/deps/x265/lib/pkgconfig:$HOME/deps/libde265/lib/pkgconfig:$HOME/deps/libheif/lib/pkgconfig" >> "$GITHUB_ENV"

          echo "CMAKE_PREFIX_PATH=$HOME/deps/dav1d:$HOME/deps/aom:$HOME/deps/x265:$HOME/deps/libde265:$HOME/deps/libheif" >> "$GITHUB_ENV"

          echo "LD_LIBRARY_PATH=$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib" >> "$GITHUB_ENV"

      - name: Verify codec versions
        run: |
          pkg-config --modversion dav1d
          pkg-config --modversion aom
          pkg-config --modversion x265
          pkg-config --modversion libde265
          pkg-config --modversion libheif

      - name: Build wheels
        id: build-wheel
        run: |
          uv sync --no-install-project
          maturin build --release --out dist --features vendored -i python3.14 --strip --target ${{ matrix.target }} --compatibility manylinux_2_39 --auditwheel=repair -- -C link-arg=-fuse-ld=mold -C link-arg=-Wl,-O3

      - name: Save Rust Cache
        if: steps.rust-cache-restore.outputs.cache-hit != 'true' && steps.build-wheel.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}

      - name: Install and verify wheels
        run: |
          uv sync --extra test --no-install-project
          uv pip install dist/*.whl
          uv run --no-sync scripts/verify_behavior.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    needs: prepare
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Restore Rust Cache
        id: rust-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable

      - name: Install Python from uv
        run: |
          uv python install 3.14
          uv tool install maturin
          uv tool install delocate

      - name: Install Deps
        run: |
          brew install dav1d libheif aom x265 libde265 llvm lld cmake ninja nasm
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Setup ENV
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
          echo "CFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS=-O3 -w ${CMAKE_CXX_FLAGS:-}" >> "$GITHUB_ENV"
          echo "CMAKE_C_FLAGS=-O3 -w ${CMAKE_C_FLAGS:-}" >> "$GITHUB_ENV"

      - name: Build wheels
        id: build-wheel
        run: |
          uv sync --no-install-project
          maturin build --release --out dist-unrepaired --features vendored -i python3.14 --strip --auditwheel=skip -- -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O3

      - name: Save Rust Cache
        if: steps.rust-cache-restore.outputs.cache-hit != 'true' && steps.build-wheel.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}

      - name: Repair macOS wheels
        run: delocate-wheel --require-archs=arm64 -v -w dist dist-unrepaired/*.whl

      - name: Install and Verify wheels
        run: |
          uv sync --extra test --no-install-project
          uv pip install dist/*.whl
          uv run --no-sync scripts/verify_behavior.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: prepare
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    needs: [linux, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
