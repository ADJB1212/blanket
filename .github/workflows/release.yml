name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created at the selected workflow commit if missing)
        required: true
        type: string

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  RUST_BACKTRACE: "1"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAG:?A release tag is required}"
          : "${GITHUB_REPOSITORY:?A repository is required}"
          : "${GITHUB_SHA:?A workflow commit is required}"

          # Create the ref explicitly: a draft release need not materialize its tag.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            exit 0
          fi

          # Keep new releases as drafts until they are explicitly published.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes ""

  linux:
    needs: prepare
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cpu: x86-64-v2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-
            ${{ runner.os }}-cargo-${{ matrix.target }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Install Python from uv
        run: |
          uv python install 3.14
          uv tool install 'maturin[patchelf]>=1.15,<2'
      - name: Install HEIF codecs
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev libheif-dev libde265-dev libx265-dev libnuma-dev clang llvm lld ninja-build
      - name: Setup PATH
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - uses: ilammy/setup-nasm@v1
        with:
          version: 3.02
      - name: Build wheels
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C target-cpu=${{ matrix.cpu }} -C link-arg=-Wl,-O3"
          CFLAGS: "-O3"
          CXXFLAGS: "-O3"
        run: |
          uv sync --no-install-project
          maturin build --release --out dist --features vendored -i python3.14 --strip --target ${{ matrix.target }} --compatibility manylinux_2_39 --auditwheel=repair
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    needs: prepare
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            cpu: apple-m1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-vendored-
            ${{ runner.os }}-cargo-${{ matrix.target }}-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Install Python from uv
        run: |
          uv python install 3.14
          uv tool install maturin
      - uses: ilammy/setup-nasm@v1
        with:
          version: 3.02
      - name: Install HEIF codecs
        run: |
          brew install dav1d libheif llvm lld cmake ninja
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
      - name: Setup PATH
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Build wheels
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }} -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O3"
          CFLAGS: "-O3"
          CXXFLAGS: "-O3"
        run: |
          uv sync --no-install-project
          maturin build --release --out dist --features vendored -i python3.14 --strip --auditwheel=repair
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: prepare
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    needs: [linux, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
