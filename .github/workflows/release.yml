name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload wheels to
        required: true
        type: string

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  RUST_BACKTRACE: "1"

permissions:
  contents: write

jobs:
  linux:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            cpu: x86-64-v2
          - target: x86_64-unknown-linux-musl
            cpu: x86-64-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - name: Install Python from uv
        run: uv python install 3.14
      - name: Install HEIF codecs (Linux)
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265 libheif-plugin-x265 libnuma-dev
      - uses: ilammy/setup-nasm@v1
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C target-cpu=${{ matrix.cpu }}"
        with:
          command: build
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --features vendored,x86-simd
            -i python3.14
            --strip
            --auditwheel=repair
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            cpu: apple-m1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - name: Install Python from uv
        run: uv python install 3.14
      - name: Install HEIF codecs (macOS)
        run: brew install libheif
      - uses: ilammy/setup-nasm@v1
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }} -C link-arg=-fuse-ld=lld"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features vendored,neon -i python3.14 --strip --auditwheel=repair
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  windows:
    timeout-minutes: 40
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            cpu: x86-64-v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - name: Install Python from uv
        run: uv python install 3.14
      - uses: ilammy/setup-nasm@v1
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features vendored,x86-simd -i python3.14 --strip --auditwheel=repair
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
