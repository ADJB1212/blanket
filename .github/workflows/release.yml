name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created at the selected workflow commit if missing)
        required: true
        type: string

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  RUST_BACKTRACE: "1"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"
  UV_NO_SYNC: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ASK: "1"
  HOMEBREW_NO_DEPRECATED_WARNINGS: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      aom-version: ${{ steps.versions.outputs.aom }}
      x265-version: ${{ steps.versions.outputs.x265 }}
      libde265-version: ${{ steps.versions.outputs.libde265 }}
      dav1d-version: ${{ steps.versions.outputs.dav1d }}
      libheif-version: ${{ steps.versions.outputs.libheif }}
      libwebp-version: ${{ steps.versions.outputs.libwebp }}
      libjxl-version: ${{ steps.versions.outputs.libjxl }}
      lcms2-version: ${{ steps.versions.outputs.lcms2 }}
    steps:
      - name: Set codec versions
        id: versions
        run: |
          echo "aom=v3.15.2" >> "$GITHUB_OUTPUT"
          echo "x265=4.3" >> "$GITHUB_OUTPUT"
          echo "libde265=v1.1.3" >> "$GITHUB_OUTPUT"
          echo "dav1d=1.5.4" >> "$GITHUB_OUTPUT"
          echo "libheif=v1.23.7" >> "$GITHUB_OUTPUT"
          echo "libwebp=v1.6.0" >> "$GITHUB_OUTPUT"
          echo "libjxl=v0.12.0" >> "$GITHUB_OUTPUT"
          echo "lcms2=lcms2.19.1" >> "$GITHUB_OUTPUT"
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${TAG:?A release tag is required}"
          : "${GITHUB_REPOSITORY:?A repository is required}"
          : "${GITHUB_SHA:?A workflow commit is required}"

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            exit 0
          fi

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --notes ""

  aom:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-aom.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.aom-version }}

  x265:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-x265.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.x265-version }}

  libde265:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-libde265.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libde265-version }}

  dav1d:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-dav1d.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.dav1d-version }}

  libheif:
    needs: [prepare, aom, x265, libde265, dav1d]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-libheif.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libheif-version }}
      aom-version: ${{ needs.prepare.outputs.aom-version }}
      x265-version: ${{ needs.prepare.outputs.x265-version }}
      libde265-version: ${{ needs.prepare.outputs.libde265-version }}
      dav1d-version: ${{ needs.prepare.outputs.dav1d-version }}

  libwebp:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-libwebp.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libwebp-version }}

  libjxl:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-libjxl.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.libjxl-version }}

  lcms2:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest]
    uses: ./.github/workflows/build-lcms2.yml
    with:
      runner: ${{ matrix.runner }}
      version: ${{ needs.prepare.outputs.lcms2-version }}

  linux:
    needs: [prepare, libheif, libwebp, libjxl, lcms2]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ format('quay.io/pypa/manylinux_2_28_{0}', matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64' || 'x86_64') }}
      options: --cap-add=SYS_NICE
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Restore Rust Cache
        id: rust-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ matrix.target }}-source-codecs-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.libwebp-version }}-${{ needs.prepare.outputs.libjxl-version }}-${{ needs.prepare.outputs.lcms2-version }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
      - name: Configure manylinux toolchain
        run: bash scripts/setup_manylinux.sh
      - name: Install build frontend
        run: |
          uv python install 3.14
          uv tool install 'maturin[patchelf]>=1.15,<2'
      - name: Restore aom
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/aom
          key: sources-v1-aom-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.aom-version }}
          fail-on-cache-miss: true
      - name: Restore x265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/x265
          key: sources-v1-x265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.x265-version }}
          fail-on-cache-miss: true
      - name: Restore libde265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libde265
          key: sources-v1-libde265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libde265-version }}
          fail-on-cache-miss: true
      - name: Restore dav1d
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/dav1d
          key: sources-v1-dav1d-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libheif
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libheif
          key: sources-v1-libheif-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libwebp
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libwebp
          key: sources-v1-libwebp-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libwebp-version }}
          fail-on-cache-miss: true
      - name: Restore libjxl
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libjxl
          key: sources-v1-libjxl-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libjxl-version }}
          fail-on-cache-miss: true
      - name: Restore LCMS2
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/lcms2
          key: sources-v1-lcms2-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.lcms2-version }}
          fail-on-cache-miss: true

      - name: Setup codec paths
        run: |
          echo "LCMS2_LIB_DIR=$HOME/deps/lcms2/lib" >> "$GITHUB_ENV"
          echo "LCMS2_INCLUDE_DIR=$HOME/deps/lcms2/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/deps/dav1d/lib/pkgconfig:$HOME/deps/aom/lib/pkgconfig:$HOME/deps/x265/lib/pkgconfig:$HOME/deps/libde265/lib/pkgconfig:$HOME/deps/libheif/lib/pkgconfig:$HOME/deps/libwebp/lib/pkgconfig:$HOME/deps/libjxl/lib/pkgconfig:$HOME/deps/lcms2/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/deps/dav1d:$HOME/deps/aom:$HOME/deps/x265:$HOME/deps/libde265:$HOME/deps/libheif:$HOME/deps/libwebp:$HOME/deps/libjxl" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/lcms2/lib:$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib:$HOME/deps/libjxl/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/deps/lcms2/lib:$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib:$HOME/deps/libjxl/lib" >> "$GITHUB_ENV"
      - name: Verify codec versions
        run: |
          pkg-config --modversion dav1d
          pkg-config --modversion aom
          pkg-config --modversion x265
          pkg-config --modversion libde265
          pkg-config --modversion libheif
          pkg-config --modversion libwebp
          pkg-config --modversion libjxl
          pkg-config --modversion lcms2
      - name: Prepare licenses and corresponding source
        env:
          BLANKET_RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/prepare_release_sources.sh
      - name: Build wheels
        id: build-wheel
        env:
          TUNE_ARGS: >-
            ${{ case(
              runner.arch == 'X64', '-C target-cpu=x86-64',
              runner.arch == 'ARM64', '-C target-cpu=generic',
              ''
            ) }}
        run: |
          uv sync --no-install-project --only-group test --python /opt/python/cp314-cp314/bin/python
          maturin build --release --out dist --features default -i python3.12 python3.13 python3.14 python3.15 --strip --target ${{ matrix.target }} --compatibility manylinux_2_28 --auditwheel=repair -- -C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O3 $TUNE_ARGS
      - name: Save Rust Cache
        if: steps.rust-cache-restore.outputs.cache-hit != 'true' && steps.build-wheel.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}
      - name: Audit bundled wheels
        run: |
          for wheel in dist/*.whl; do
            auditwheel show "$wheel"
            auditwheel repair --plat manylinux_2_28_${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }} "$wheel" -w "$RUNNER_TEMP/audited"
          done
      - name: Install and verify wheels
        env:
          LD_LIBRARY_PATH: ""
        run: |
          uv pip install --python .venv/bin/python --compile-bytecode dist/*-cp314-cp314-*.whl
          .venv/bin/python scripts/verify_behavior.py
          .venv/bin/python -m pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/*-sources-*.tar.bz2

  macos:
    needs: [prepare, libheif, libwebp, libjxl, lcms2]
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Restore Rust Cache
        id: rust-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-source-codecs-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.libwebp-version }}-${{ needs.prepare.outputs.libjxl-version }}-${{ needs.prepare.outputs.lcms2-version }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Configure macOS toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
      - name: Install Python from uv
        run: |
          uv python install 3.12 3.13 3.14 3.15
          uv tool install maturin
          uv tool install delocate
      - name: Install build tools
        run: |
          brew install llvm lld cmake ninja nasm pkg-config gcc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "CFLAGS=-O3" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-O3" >> "$GITHUB_ENV"
      - name: Restore aom
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/aom
          key: sources-v1-aom-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.aom-version }}
          fail-on-cache-miss: true
      - name: Restore x265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/x265
          key: sources-v1-x265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.x265-version }}
          fail-on-cache-miss: true
      - name: Restore libde265
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libde265
          key: sources-v1-libde265-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libde265-version }}
          fail-on-cache-miss: true
      - name: Restore dav1d
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/dav1d
          key: sources-v1-dav1d-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libheif
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libheif
          key: sources-v1-libheif-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libheif-version }}-${{ needs.prepare.outputs.aom-version }}-${{ needs.prepare.outputs.x265-version }}-${{ needs.prepare.outputs.libde265-version }}-${{ needs.prepare.outputs.dav1d-version }}
          fail-on-cache-miss: true
      - name: Restore libwebp
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libwebp
          key: sources-v1-libwebp-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libwebp-version }}
          fail-on-cache-miss: true
      - name: Restore libjxl
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/libjxl
          key: sources-v1-libjxl-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.libjxl-version }}
          fail-on-cache-miss: true
      - name: Restore LCMS2
        uses: actions/cache/restore@v6
        with:
          path: ~/deps/lcms2
          key: sources-v1-lcms2-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.lcms2-version }}
          fail-on-cache-miss: true
      - name: Setup codec paths
        run: |
          echo "LCMS2_LIB_DIR=$HOME/deps/lcms2/lib" >> "$GITHUB_ENV"
          echo "LCMS2_INCLUDE_DIR=$HOME/deps/lcms2/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/deps/dav1d/lib/pkgconfig:$HOME/deps/aom/lib/pkgconfig:$HOME/deps/x265/lib/pkgconfig:$HOME/deps/libde265/lib/pkgconfig:$HOME/deps/libheif/lib/pkgconfig:$HOME/deps/libwebp/lib/pkgconfig:$HOME/deps/libjxl/lib/pkgconfig:$HOME/deps/lcms2/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$HOME/deps/dav1d:$HOME/deps/aom:$HOME/deps/x265:$HOME/deps/libde265:$HOME/deps/libheif:$HOME/deps/libwebp:$HOME/deps/libjxl" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/deps/lcms2/lib:$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib:$HOME/deps/libjxl/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$HOME/deps/lcms2/lib:$HOME/deps/dav1d/lib:$HOME/deps/aom/lib:$HOME/deps/x265/lib:$HOME/deps/libde265/lib:$HOME/deps/libheif/lib:$HOME/deps/libwebp/lib:$HOME/deps/libjxl/lib" >> "$GITHUB_ENV"
      - name: Verify codec versions
        run: |
          pkg-config --modversion dav1d
          pkg-config --modversion aom
          pkg-config --modversion x265
          pkg-config --modversion libde265
          pkg-config --modversion libheif
          pkg-config --modversion libwebp
          pkg-config --modversion libjxl
          pkg-config --modversion lcms2
      - name: Prepare licenses and corresponding source
        env:
          BLANKET_RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/prepare_release_sources.sh
      - name: Build wheels
        id: build-wheel
        run: |
          uv sync --no-install-project --only-group test --managed-python --python 3.14
          maturin build --release --out dist-unrepaired --features default -i python3.12 python3.13 python3.14 python3.15 --strip --auditwheel=skip -- -C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O3 -C target-cpu=apple-m1
      - name: Save Rust Cache
        if: steps.rust-cache-restore.outputs.cache-hit != 'true' && steps.build-wheel.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache-restore.outputs.cache-primary-key }}
      - name: Repair macOS wheels
        run: delocate-wheel --require-archs=arm64 -v -w dist dist-unrepaired/*.whl
      - name: Install and verify wheels
        run: |
          uv pip install --compile-bytecode dist/*-cp314-cp314-*.whl
          uv run scripts/verify_behavior.py
          uv run pytest
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: |
            dist/*.whl
            dist/*-sources-*.tar.bz2

  sdist:
    needs: prepare
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    needs: [linux, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
