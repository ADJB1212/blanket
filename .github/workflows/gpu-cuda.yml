name: NVIDIA GPU

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/gpu-cuda.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/gpu-cuda.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ASK: "1"
  HOMEBREW_NO_DEPRECATED_WARNINGS: "1"
  UV_NO_SYNC: "1"
  BLANKET_REQUIRE_CUDA: "1"

permissions:
  contents: read

jobs:
  cuda:
    # Opt in only on trusted revisions; never run pull-request code on this runner.
    if: github.event_name == 'workflow_dispatch' || vars.BLANKET_NVIDIA_CI == 'true'
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Check NVIDIA driver
        run: nvidia-smi
      - name: Install Python dependencies
        run: |
          uv python install 3.14
          uv tool install maturin
          uv sync --no-install-project --group test --group gpu-cuda
      - name: Build development extension
        run: maturin develop --uv --features gpu-cuda,no-vendored-webp,use-system-lcms2,jxl-vendored,embedded-libheif
      - name: Validate CUDA source and contracts
        run: cargo test -p blanket-gpu -p blanket-gpu-cuda --locked
      - name: NVIDIA hardware parity and interoperability
        run: uv run pytest tests/test_gpu_cuda.py -n 0 -ra -x
