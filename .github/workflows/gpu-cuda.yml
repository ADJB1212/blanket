name: CUDA wheel

on:
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "hardlink"
  CARGO_INCREMENTAL: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@v7
      - name: Restore Rust dependencies and build artifacts
        id: cargo-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: CI-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: CI-${{ runner.os }}-${{ runner.arch }}-cargo-
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install wheel builder
        run: |
          uv python install 3.14
          uv tool install 'maturin[patchelf]>=1.15,<2'
          cargo clean -p lcms2-sys
          cargo clean -p lcms2
          cargo clean -p libheif-sys
      - name: Install build dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config nasm mold libheif-dev libwebp-dev libdav1d-dev libde265-dev libx265-dev libnuma-dev clang-23 llvm-23 cmake
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo "CC=/usr/lib/llvm-23/bin/clang-23" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-23/bin/clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=/usr/lib/llvm-23/bin/clang-23" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++" >> "$GITHUB_ENV"
      - name: Install CUDA compiler
        run: bash scripts/setup_cuda.sh
      - name: Compile kernels and build development wheel
        run: maturin build --profile dev -i python3.14 --out dist --auditwheel=repair --features gpu-cuda,no-vendored-webp,jxl-vendored,embedded-libheif -- -C link-arg=-fuse-ld=mold
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: blanket-cuda-dev-linux-x86_64-py314
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 2
