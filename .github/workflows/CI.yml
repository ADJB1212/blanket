name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/*"
      - ".github/workflows/release.yml"
      - ".github/workflows/benchmark.yml"
      - "scripts/benchmark_compression.py"
      - "scripts/benchmark.py"
  pull_request:
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  PYTHONFAULTHANDLER: "1"

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install Deps and Setup PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev libheif-dev libde265-dev libx265-dev libnuma-dev clang-23 llvm-23 lld-23 ninja-build mold nasm
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo "FUSE_LINKER=mold" >> "$GITHUB_ENV"
          echo "CC=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang-23" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
      - name: Install Deps and Setup PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install dav1d libheif aom x265 libde265 llvm lld cmake ninja nasm
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          echo "FUSE_LINKER=lld" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Install project and test dependencies
        run: |
          uv sync --no-install-project --extra test
          uv tool install maturin
          maturin develop --extras test --uv --profile dev --features embedded-libheif,vendored -- -C link-arg=-fuse-ld=$FUSE_LINKER
      - name: Test Python API
        run: uv run --no-sync pytest --ignore=tests/test_benchmark.py --color=no --code-highlight=no
      - name: Test native SIMD kernels
        run: cargo test --lib --features embedded-libheif,vendored
      - name: Verify Pillow behavior
        run: uv run --no-sync scripts/verify_behavior.py
