name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          enable-cache: true
      - name: Install project and test dependencies
        run: uv sync --locked --extra test
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test
      - name: Test Python API
        run: uv run --no-sync pytest -q
      - name: Verify Pillow behavior
        run: uv run --no-sync python scripts/verify_behavior.py
      - name: Verify Pillow interoperability
        run: uv run --no-sync python scripts/verify_interop.py
      - name: Smoke-test benchmark
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: >-
          uv run --no-sync python scripts/benchmark.py
          --width 64 --height 64 --iterations 2 --warmups 1
