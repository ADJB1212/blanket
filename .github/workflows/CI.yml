name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/*"
  pull_request:
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "15.0"

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.14"
            cpu: x86-64-v2
          - os: macos-latest
            python: "3.14"
            cpu: apple-m1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.cpu }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.cpu }}-
            ${{ runner.os }}-cargo-
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Install HEIF codecs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev libheif-dev libheif-plugin-libde265 libheif-plugin-x265 libnuma-dev clang llvm lld ninja-build
      - name: Install HEIF codecs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install dav1d libheif llvm lld cmake ninja
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
      - name: Setup PATH
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - uses: ilammy/setup-nasm@v1
        with:
          version: 3.02
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Install project and test dependencies
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
        run: |
          uv sync --no-install-project --extra test
          uv tool install maturin
          maturin develop --extras test --uv --profile dev
      - name: Test Python API
        env:
          CI: 1
        run: uv run --no-sync pytest --ignore=tests/test_benchmark.py --ignore=tests/test_compression_benchmark.py
      - name: Verify Pillow behavior
        run: uv run --no-sync scripts/verify_behavior.py
