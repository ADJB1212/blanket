name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/CI.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/CI.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ASK: "1"
  HOMEBREW_NO_DEPRECATED_WARNINGS: "1"
  UV_NO_SYNC: "1"

permissions:
  contents: read
  actions: write

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.14"
          - os: ubuntu-26.04-arm
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Rust dependencies and build artifacts
        id: cargo-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: CI-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: CI-${{ runner.os }}-${{ runner.arch }}-cargo-
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"
      - name: Set up Homebrew
        if: runner.os == 'macOS'
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Deps and Setup PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" | sudo tee /etc/apt/sources.list.d/llvm-23.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y libwebp-dev libdav1d-dev libheif-dev libde265-dev libx265-dev libnuma-dev clang-23 llvm-23 lld-23 ninja-build mold nasm liblcms2-dev
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          echo "FUSE_LINKER=mold" >> "$GITHUB_ENV"
          echo "CC=/usr/lib/llvm-23/bin/clang-23" >> "$GITHUB_ENV"
          echo "CXX=/usr/lib/llvm-23/bin/clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=/usr/lib/llvm-23/bin/clang-23" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=/usr/lib/llvm-23/bin/clang++" >> "$GITHUB_ENV"
          echo "BUILD_FEATURES=jxl-vendored,no-vendored-webp,embedded-libheif,use-system-lcms2" >> "$GITHUB_ENV"
      - name: Install Deps and Setup PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install dav1d libheif aom x265 libde265 llvm lld cmake ninja nasm webp jpeg-xl little-cms2
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "FUSE_LINKER=lld" >> "$GITHUB_ENV"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          echo "BUILD_FEATURES=no-vendored-webp,use-system-lcms2" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Force rebuild crates that use homebrew dylibs
        if: runner.os == 'macOS'
        run: |
          cargo clean -p libwebp-sys
          cargo clean -p libheif-sys
          cargo clean -p dav1d-sys
          cargo clean -p jpegxl-sys
          cargo clean -p lcms2-sys
      - name: Install project and test dependencies
        run: |
          uv sync --no-install-project --only-group test
          uv tool install maturin
          maturin develop -G test --uv --profile dev --features $BUILD_FEATURES -- -C linker=clang -C link-arg=-fuse-ld=$FUSE_LINKER -Z threads=4
      - name: Test Python API
        run: uv run pytest
      - name: Test x86 SIMD kernels
        if: runner.arch == 'X64'
        run: cargo test --features $BUILD_FEATURES
      - name: Verify Pillow behavior
        run: uv run scripts/verify_behavior.py
      - name: Delete stale Rust caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache-restore.outputs.cache-matched-key != steps.cargo-cache-restore.outputs.cache-primary-key
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: CI-${{ runner.os }}-${{ runner.arch }}-cargo-
        run: |
          gh cache list --key "$CACHE_PREFIX" --json id,key --jq '.[].id' \
            | xargs -r -n1 gh cache delete
      - name: Save Rust dependencies and build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}
