name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "15.0"

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
            cpu: x86-64-v2
            features: vendored,x86-simd
          - os: macos-latest
            python: "3.14"
            cpu: apple-m1
            features: vendored,neon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - uses: ilammy/setup-nasm@v1
      - name: Install HEIF codecs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265 libheif-plugin-x265 libnuma-dev
      - name: Install HEIF codecs (macOS)
        if: runner.os == 'macOS'
        run: brew install libheif
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Install project and test dependencies
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
        run: |
          uv sync --no-install-project --extra test --compile
          uv tool install maturin
          maturin develop -r --extras test --uv -F ${{ matrix.features }}
      - name: Test Python API
        run: uv run --no-sync pytest
      - name: Verify Pillow behavior
        run: uv run --no-sync scripts/verify_behavior.py
      - name: Smoke-test benchmark
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: >-
          uv run --no-sync scripts/benchmark.py --sizes web photo -v -w 1 -i 3
