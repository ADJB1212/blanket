name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/CI.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
      - "!scripts/setup_cuda.sh"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/CI.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
      - "!scripts/setup_cuda.sh"
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "hardlink"
  CARGO_INCREMENTAL: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ASK: "1"
  HOMEBREW_NO_DEPRECATED_WARNINGS: "1"
  UV_NO_SYNC: "1"

permissions:
  contents: read
  actions: write

jobs:
  test:
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            python: "3.14"
          - os: ubuntu-26.04-arm
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore Rust dependencies and build artifacts
        id: cargo-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: CI-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: CI-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Clean outdated Rust build artifacts
        if: steps.cargo-cache-restore.outputs.cache-hit != 'true'
        run: cargo clean --locked

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Configure macOS toolchain
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"

      - name: Set up Homebrew
        if: runner.os == 'macOS'
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: Install Deps and Setup PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev libdav1d-dev libheif-dev libde265-dev libx265-dev libnuma-dev ninja-build mold nasm liblcms2-dev
          echo "FUSE_LINKER=mold" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
          echo "BUILD_FEATURES=jxl-vendored,no-vendored-webp,embedded-libheif,use-system-lcms2,gpu-cuda" >> "$GITHUB_ENV"
          echo "N_THREADS=4" >> "$GITHUB_ENV"
          if [ "$RUNNER_ARCH" = "ARM64" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-lwebpdemux" >> "$GITHUB_ENV"
          fi

      - name: Install CUDA compiler (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/setup_cuda.sh

      - name: Install Deps and Setup PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install dav1d libheif aom x265 libde265 cmake ninja nasm webp jpeg-xl little-cms2
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "FUSE_LINKER=ld" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
          echo "BUILD_FEATURES=no-vendored-webp,use-system-lcms2,gpu-metal" >> "$GITHUB_ENV"
          echo "N_THREADS=3" >> "$GITHUB_ENV"

      - name: Run Clippy
        run: cargo clippy --lib --workspace --no-deps --profile ci --locked --features $BUILD_FEATURES -- -Z threads=$N_THREADS

      - name: Run Rust Tests (Linux)
        if: runner.os == 'Linux'
        run: cargo test --tests --lib --workspace --profile ci --locked --features $BUILD_FEATURES

      - name: Run Rust Tests (MacOS)
        if: runner.os == 'macOS'
        run: cargo test --tests --lib --workspace --profile ci --locked --features $BUILD_FEATURES --exclude blanket-gpu-cuda

      - name: Install project and test dependencies
        id: build-project
        run: |
          uv python install 3.14
          uv tool install maturin
          uv sync --no-install-project --only-group test --managed-python
          maturin develop -G test --uv --profile ci --features $BUILD_FEATURES -- -C linker=clang -C link-arg=-fuse-ld=$FUSE_LINKER -Z threads=$N_THREADS

      - name: Verify GPU backend is compiled
        run: uv run python -c 'import sys; from blanket import ImageGpu; backend = "metal" if sys.platform == "darwin" else "cuda"; info = ImageGpu.capabilities(backend); assert info["compiled"], info; print(info)'

      - name: Test Python API
        run: uv run pytest

      - name: Verify Pillow behavior
        run: uv run scripts/verify_behavior.py

      - name: Prune workspace from cache
        if: always() && steps.build-project.outcome == 'success'
        run: cargo clean --workspace --locked

      - name: Save Rust dependencies and build artifacts
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-project.outcome == 'success' && steps.cargo-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}

      - name: Delete stale Rust caches
        if: always() && steps.cargo-cache-save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: CI-${{ runner.os }}-${{ runner.arch }}-cargo-
          CURRENT_KEY: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}
        run: |
          gh cache list --key "$CACHE_PREFIX" --ref refs/heads/main --limit 100 --json id,key \
            | jq -r --arg current "$CURRENT_KEY" '.[] | select(.key != $current) | .id' | xargs -r -n1 gh cache delete
