name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "copy"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "15.0"

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
            cpu: x86-64-v2
            features: vendored,x86-simd
            cache-features: vendored-x86-simd
          - os: macos-latest
            python: "3.14"
            cpu: apple-m1
            features: vendored,neon
            cache-features: vendored-neon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.cpu }}-${{ matrix.cache-features }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.cpu }}-${{ matrix.cache-features }}-
            ${{ runner.os }}-cargo-${{ matrix.cpu }}-
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: false
      - name: Install HEIF codecs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265 libheif-plugin-x265 libnuma-dev clang llvm lld ninja-build
      - name: Install HEIF codecs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libheif llvm lld cmake ninja
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
      - name: Setup PATH
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - uses: ilammy/setup-nasm@v1
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Install project and test dependencies
        env:
          RUSTFLAGS: "-C target-cpu=${{ matrix.cpu }}"
        run: |
          uv sync --no-install-project --extra test --compile
          uv tool install maturin
          maturin develop --extras test --uv -F ${{ matrix.features }} --profile dev
      - name: Test Python API
        env:
          CI: 1
        run: uv run --no-sync pytest --ignore=tests/test_benchmark.py
      - name: Verify Pillow behavior
        run: uv run --no-sync scripts/verify_behavior.py
