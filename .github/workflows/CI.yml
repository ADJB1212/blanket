name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true
      - uses: ilammy/setup-nasm@v1
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Install project and test dependencies
        run: |
          uv sync --no-install-project --extra test --compile
          uv tool install maturin
          maturin develop -r --extras test --uv
      - name: Test Python API
        run: uv run --no-sync pytest
      - name: Verify Pillow behavior
        run: uv run --no-sync scripts/verify_behavior.py
      - name: Smoke-test benchmark
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: >-
          uv run --no-sync scripts/benchmark.py --sizes web photo -v -w 1 -i 3
