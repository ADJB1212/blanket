name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/CI.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
      - "!scripts/setup_cuda.sh"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/CI.yml"
      - "scripts/**"
      - "!scripts/verify_behavior.py"
      - "!scripts/setup_cuda.sh"
  workflow_dispatch:

env:
  RUSTUP_TERM_PROGRESS_WHEN: "never"
  RUST_BACKTRACE: "1"
  UV_LINK_MODE: "hardlink"
  CARGO_INCREMENTAL: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  PYTHONFAULTHANDLER: "1"
  DO_NOT_TRACK: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ASK: "1"
  HOMEBREW_NO_DEPRECATED_WARNINGS: "1"
  UV_NO_SYNC: "1"
  RUSTUP_AUTO_INSTALL: "0"
  RUSTUP_TOOLCHAIN: nightly-2026-11-12

permissions:
  contents: read
  actions: write

jobs:
  linux:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/adjb1212/blanket-ci:v2
      options: --cap-add=SYS_NICE
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      FUSE_LINKER: mold
      CC: clang
      CXX: clang++
      CMAKE_CC_COMPILER: clang
      CMAKE_CXX_COMPILER: clang++
      BUILD_FEATURES: no-vendored-webp,gpu-cuda
      PKG_CONFIG_PATH: /opt/blanket-deps/dav1d/lib/pkgconfig:/opt/blanket-deps/aom/lib/pkgconfig:/opt/blanket-deps/x265/lib/pkgconfig:/opt/blanket-deps/libde265/lib/pkgconfig:/opt/blanket-deps/libheif/lib/pkgconfig:/opt/blanket-deps/libwebp/lib/pkgconfig:/opt/blanket-deps/libjxl/lib/pkgconfig:/opt/blanket-deps/lcms2/lib/pkgconfig
      CMAKE_PREFIX_PATH: /opt/blanket-deps/dav1d:/opt/blanket-deps/aom:/opt/blanket-deps/x265:/opt/blanket-deps/libde265:/opt/blanket-deps/libheif:/opt/blanket-deps/libwebp:/opt/blanket-deps/libjxl:/opt/blanket-deps/lcms2
      LD_LIBRARY_PATH: /opt/blanket-deps/wheel/lib:/opt/blanket-deps/lcms2/lib:/opt/blanket-deps/dav1d/lib:/opt/blanket-deps/aom/lib:/opt/blanket-deps/x265/lib:/opt/blanket-deps/libde265/lib:/opt/blanket-deps/libheif/lib:/opt/blanket-deps/libwebp/lib:/opt/blanket-deps/libjxl/lib
      LCMS2_LIB_DIR: /opt/blanket-deps/lcms2/lib
      LCMS2_INCLUDE_DIR: /opt/blanket-deps/lcms2/include
      LDFLAGS: -fuse-ld=mold
      RUSTFLAGS: -C linker=clang -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v7

      - name: Restore Rust dependencies and build artifacts
        id: cargo-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            /opt/cargo/registry/index
            /opt/cargo/registry/cache
            /opt/cargo/git/db
            target
          key: CI-Linux-container-v1-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: CI-Linux-container-v1-${{ runner.arch }}-cargo-

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"

      - name: Set up Python 3.14 for PyO3
        run: |
          uv python install 3.14
          python_executable=$(uv python find --managed-python 3.14)
          python_libdir=$("$python_executable" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          echo "PYO3_PYTHON=$python_executable" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$python_libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify native codec libraries
        run: pkg-config --modversion dav1d aom x265 libde265 libheif libwebp libwebpmux libwebpdemux libjxl libjxl_threads lcms2

      - name: Run Rust Tests
        run: cargo test --tests --lib --workspace --profile ci --locked --features $BUILD_FEATURES

      - name: Install project and test dependencies
        run: |
          uv tool install maturin
          export PATH="$(uv tool dir --bin):$PATH"
          uv sync --no-install-project --only-group test --managed-python
          maturin develop -G test --uv --profile ci --features $BUILD_FEATURES -- -C linker=clang -C link-arg=-fuse-ld=$FUSE_LINKER

      - name: Verify GPU backend is compiled
        run: uv run python -c 'from blanket import ImageGpu; info = ImageGpu.capabilities("cuda"); assert info["compiled"], info; print(info)'

      - name: Test Python API
        run: uv run pytest

      - name: Verify Pillow behavior
        run: uv run scripts/verify_behavior.py

      - name: Delete stale Rust caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache-restore.outputs.cache-matched-key != steps.cargo-cache-restore.outputs.cache-primary-key
        uses: actions/github-script@v8
        env:
          CACHE_PREFIX: CI-Linux-container-v1-${{ runner.arch }}-cargo-
          CACHE_KEY: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}
        with:
          script: |
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo,
              key: process.env.CACHE_PREFIX,
              ref: context.ref,
              per_page: 100,
            });
            for (const cache of caches) {
              if (cache.key !== process.env.CACHE_KEY) {
                await github.rest.actions.deleteActionsCacheById({
                  ...context.repo,
                  cache_id: cache.id,
                });
              }
            }

      - name: Save Rust dependencies and build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            /opt/cargo/registry/index
            /opt/cargo/registry/cache
            /opt/cargo/git/db
            target
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}

  macos:
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore Rust dependencies and build artifacts
        id: cargo-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: CI-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: CI-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Configure macOS toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

          echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: "false"
          save-cache: "false"

      - name: Install Deps and Setup PATH (macOS)
        run: |
          brew install dav1d libheif aom x265 libde265 cmake ninja nasm webp little-cms2 pkgconf
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LCMS2_LIB_DIR=/opt/homebrew/opt/little-cms2/lib" >> "$GITHUB_ENV"
          echo "LCMS2_INCLUDE_DIR=/opt/homebrew/opt/little-cms2/include" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "FUSE_LINKER=ld" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CMAKE_CC_COMPILER=clang" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER=clang++" >> "$GITHUB_ENV"
          echo "BUILD_FEATURES=jxl-vendored,no-vendored-webp,gpu-metal" >> "$GITHUB_ENV"

      - name: Run Rust Tests (MacOS)
        run: cargo test --tests --lib --workspace --profile ci --locked --features $BUILD_FEATURES --exclude blanket-gpu-cuda

      - name: Install project and test dependencies
        id: build-project
        run: |
          uv python install 3.14
          uv tool install maturin
          uv sync --no-install-project --only-group test --managed-python
          maturin develop -G test --uv --profile ci --features $BUILD_FEATURES -- -C linker=clang -C link-arg=-fuse-ld=$FUSE_LINKER

      - name: Verify GPU backend is compiled
        run: uv run python -c 'import sys; from blanket import ImageGpu; backend = "metal" if sys.platform == "darwin" else "cuda"; info = ImageGpu.capabilities(backend); assert info["compiled"], info; print(info)'

      - name: Test Python API
        run: uv run pytest

      - name: Verify Pillow behavior
        run: uv run scripts/verify_behavior.py

      - name: Delete stale Rust caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache-restore.outputs.cache-matched-key != steps.cargo-cache-restore.outputs.cache-primary-key
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: CI-${{ runner.os }}-${{ runner.arch }}-cargo-
        run: gh cache list --key "$CACHE_PREFIX" --json id,key --jq '.[].id' | xargs -r -n1 gh cache delete

      - name: Save Rust dependencies and build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache-restore.outputs.cache-primary-key }}
