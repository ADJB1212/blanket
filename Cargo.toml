[package]
name = "blanket"
version = "0.1.0"
edition = "2024"
description = "A focused Rust-backed image library with a Pillow-shaped Python API"
authors = ["Andrew Jaffe"]
license = "MIT"

[lib]
name = "_blanket"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
garb = "0.2.8"
gamut-core = "2"
gamut-jxl = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pyo3 = "0.29"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
strip = true
incremental = false
codegen-units = 16

[profile.dev]
opt-level = 1
debug = true
lto = "off"
