[package]
name = "blanket"
version = "1.0.0"
edition = "2024"
resolver = "3"
rust-version = "1.97"
description = "A focused Rust-backed image library with a Pillow-shaped Python API"
authors = ["Andrew Jaffe"]
license = "MIT"

[lib]
name = "_blanket"
crate-type = ["cdylib"]

[dependencies]
png = "0.18"
garb = "0.2"
pyo3 = "0.29"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "rayon"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
jpegxl-rs = { version = "0.15.0", default-features = false }
turbojpeg-sys = { version = "1.2", default-features = false, features = ["cmake", "require-simd"] }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }

[features]
default = ["vendored"]
vendored = ["jpegxl-rs/vendored"]
dynamic = []
extension-module = ["pyo3/extension-module"]

[build-dependencies]
rustc_version = "0.4"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
strip = true
incremental = false
codegen-units = 1

[profile.dev]
incremental = true
codegen-units = 256
opt-level = 0
debug = "line-directives-only"
lto = false

[lints.clippy]
needless_return = "allow"