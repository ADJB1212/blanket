[package]
name = "blanket"
version = "1.0.0"
edition = "2024"
resolver = "3"
rust-version = "1.97"
description = "A focused Rust-backed image library with a Pillow-shaped Python API"
authors = ["Andrew Jaffe"]
license = "MIT"
repository = "https://github.com/ADJB1212/blanket"
exclude = [".github/*", "tests/*", "pyproject.toml", "python/*", "scripts/*", "docs/*"]

[lib]
name = "_blanket"
crate-type = ["cdylib"]

[dependencies]
png = { version = "0.18", default-features = false, features = ["zlib-rs"]}
libheif-rs = { version = "3.0", default-features = false, features = ["latest", "embedded-libheif"] }
garb = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rayon = {version = "1.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "rayon", "tiff", "webp", "avif", "avif-native", "nasm"] }
rawler = {version = "0.8", default-features = false }
webpx = "0.4"
libwebp-sys = { version = "0.14", default-features = false, features = ["std", "parallel"] }
jpegxl-rs = { version = "0.15", default-features = false }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["neon"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["avx2", "sse41"] }


[features]
default = ["vendored"]
vendored = ["jpegxl-rs/vendored"]

[build-dependencies]
rustc_version = "0.4"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 0
debug = "line-directives-only"

[profile.dev.package."*"]
debug = false
incremental = true

[lints.clippy]
needless_return = "allow"
