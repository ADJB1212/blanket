[package]
name = "blanket"
version = "0.1.0"
edition = "2024"
description = "A focused Rust-backed image library with a Pillow-shaped Python API"
authors = ["Andrew Jaffe"]
license = "MIT"

[lib]
name = "_blanket"
crate-type = ["cdylib"]

[dependencies]
garb = "0.2.8"
image = { version = "0.25.10", default-features = false, features = ["png", "rayon"] }
jpegxl-rs = { version = "0.15.0", default-features = false}
pyo3 = "0.29"
turbojpeg-sys = { version = "1.2", default-features = false, features = ["cmake", "require-simd"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }

[features]
vendored = ["jpegxl-rs/vendored"]
dynamic = []
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
debug = false
lto = "fat"
strip = true
incremental = false
codegen-units = 32

[profile.dev]
opt-level = 1
debug = true
lto = "off"
