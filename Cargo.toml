[workspace]
members = ["crates/core", "crates/codecs", "crates/ops", "crates/blanket"]
resolver = "3"

[workspace.package]
version = "0.0.2"
description = "A Rust-backed image library with a Pillow-shaped Python API"
authors = ["Andrew Jaffe <adjaffeb@gmail.com>"]
license = "MIT"
repository = "https://github.com/ADJB1212/blanket"
rust-version = "1.97"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 1
debug = "line-directives-only"
lto = "off"
codegen-units = 256

[workspace.lints.clippy]
redundant_clone = "deny"
needless_return = "allow"