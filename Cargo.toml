[package]
name = "blanket"
version = "0.0.2"
edition = "2024"
resolver = "3"
rust-version = "1.97"
description = "A Rust-backed image library with a Pillow-shaped Python API"
authors = ["Andrew Jaffe <adjaffeb@gmail.com>"]
license = "MIT"
repository = "https://github.com/ADJB1212/blanket"
documentation = "https://adjb1212.github.io/blanket-docs"
exclude = [".github/", "tests/", "pyproject.toml", "python/", "scripts/", "docs/", "uv.lock"]
publish = false

[lib]
name = "_blanket"
crate-type = ["cdylib"]

[dependencies]
png = { version = "0.18", default-features = false, features = ["zlib-rs"]}
libheif-rs = { version = "3.0", default-features = false, features = ["latest"] }
garb = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rayon = {version = "1.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif", "ico", "rayon", "tiff", "webp", "avif", "avif-native", "nasm"] }
webpx = "0.4"
libwebp-sys = { version = "0.14", default-features = false, features = ["std", "parallel"] }
jpegxl-rs = { version = "0.15", default-features = false }
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "require-simd"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["neon"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["avx2", "sse41"] }

[features]
default = ["vendored"]
vendored = ["jpegxl-rs/vendored"]
embedded-libheif = ["libheif-rs/embedded-libheif"]
user-provided-webp = ["libwebp-sys/system-dylib"]

[build-dependencies]
rustc_version = "0.4"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 1
debug = "line-directives-only"
lto = "off"
codegen-units = 256

[lints.clippy]
needless_return = "allow"
