[package]
name = "blanket"
version = "0.1.0"
edition = "2024"
description = "A focused Rust-backed image library with a Pillow-shaped Python API"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_blanket"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
