[package]
name = "blanket"
version = "0.1.0"
edition = "2024"
description = "A focused Rust-backed image library with a Pillow-shaped Python API"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_blanket"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
gamut-core = "2.0.1"
gamut-jxl = "0.4.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
pyo3 = "0.29.0"
