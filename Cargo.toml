[workspace]
members = [
    "crates/gpu",
    "crates/gpu-metal",
    "crates/gpu-cuda",
    "crates/gpu-python",
    "crates/bench-support",
    "crates/core",
    "crates/kernels",
    "crates/resample",
    "crates/font",
    "crates/cms",
    "crates/codecs",
    "crates/metadata",
    "crates/codec-common",
    "crates/codec-png",
    "crates/codec-image",
    "crates/codec-jpeg",
    "crates/codec-jxl",
    "crates/codec-heif",
    "crates/codec-pdf",
    "crates/codec-tiff",
    "crates/codec-webp",
    "crates/codec-avif",
    "crates/codec-bmp-ico",
    "crates/codec-gif",
    "crates/codec-extended",
    "crates/codec-jpeg2000",
    "crates/compressor",
    "crates/ops",
    "crates/math",
    "crates/composite",
    "crates/enhance",
    "crates/filter",
    "crates/palette",
    "crates/stat",
    "crates/draw",
    "crates/blanket",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
authors = ["Andrew Jaffe <adjaffeb@gmail.com>"]
license = "MIT"
repository = "https://github.com/ADJB1212/blanket"
rust-version = "1.98"
edition = "2024"

[workspace.dependencies]
blanket-gpu = { path = "crates/gpu" }
blanket-gpu-metal = { path = "crates/gpu-metal" }
blanket-gpu-cuda = { path = "crates/gpu-cuda" }
blanket-gpu-python = { path = "crates/gpu-python" }
blanket-kernels = { path = "crates/kernels" }
blanket-resample = { path = "crates/resample" }
blanket-font = { path = "crates/font" }
blanket-bench-support = { path = "crates/bench-support" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "rayon", "plotters", "html_reports"] }
blanket-codec-common = { path = "crates/codec-common" }
blanket-codec-avif = { path = "crates/codec-avif" }
blanket-codec-bmp-ico = { path = "crates/codec-bmp-ico" }
blanket-codec-extended = { path = "crates/codec-extended" }
blanket-codec-gif = { path = "crates/codec-gif" }
blanket-codec-heif = { path = "crates/codec-heif" }
blanket-codec-image = { path = "crates/codec-image" }
blanket-codec-jpeg = { path = "crates/codec-jpeg" }
blanket-codec-jpeg2000 = { path = "crates/codec-jpeg2000" }
blanket-codec-jxl = { path = "crates/codec-jxl" }
blanket-codec-pdf = { path = "crates/codec-pdf" }
blanket-codec-png = { path = "crates/codec-png" }
blanket-codec-tiff = { path = "crates/codec-tiff" }
blanket-codec-webp = { path = "crates/codec-webp" }
blanket-codecs = { path = "crates/codecs" }
blanket-metadata = { path = "crates/metadata" }
blanket-math = { path = "crates/math" }
blanket-core = { path = "crates/core" }
blanket-cms = { path = "crates/cms" }
blanket-composite = { path = "crates/composite" }
blanket-compressor = { path = "crates/compressor" }
blanket-draw = { path = "crates/draw" }
blanket-enhance = { path = "crates/enhance" }
blanket-filter = { path = "crates/filter" }
blanket-ops = { path = "crates/ops" }
blanket-palette = { path = "crates/palette" }
blanket-stat = { path = "crates/stat" }
rayon = { version = "1", default-features = false }
pyo3 = { version = "0.30", features = ["nightly"] }
png = { version = "0.18", default-features = false, features = ["zlib-rs"] }
turbojpeg = { version = "1", default-features = false, features = ["cmake", "require-simd"] }
rustc-hash = { version = "2", default-features = false, features = ["std", "nightly"] }
zerocopy = { version = "0.8", default-features = false, features = ["std", "simd-nightly", "float-nightly"]}
flate2 = { version = "1", default-features = false, features = ["rust_backend", "zlib-rs"] }

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 1
debug = "line-directives-only"
split-debuginfo = "unpacked"
lto = "off"
codegen-units = 256

[profile.test]
incremental = true
opt-level = 1
debug = "line-directives-only"
split-debuginfo = "unpacked"
lto = "off"
codegen-units = 256

[profile.bench]
opt-level = 3
debug = false
lto = "fat"
strip = true
codegen-units = 1
incremental = true

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unused_mut = "deny"
unused_assignments = "deny"
unreachable_pub = "deny"
unused_imports = "deny"
unused_macros = "deny"

[workspace.lints.clippy]
# Lint groups and overrides
needless_return = "allow"
perf = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Cloning and unnecessary copies
redundant_clone = "deny"
unnecessary_to_owned = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
iter_overeager_cloned = "deny"
map_clone = "deny"
clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
expl_impl_clone_on_copy = "deny"
rc_clone_in_vec_init = "warn"

# Iterators and collections
needless_collect = "deny"
format_collect = "deny"
vec_init_then_push = "deny"
vec_box = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
collection_is_never_read = "deny"
copy_iterator = "deny"
tuple_array_conversions = "deny"
manual_memcpy = "deny"

# Argument passing and type sizes
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_enum_variant = "deny"
large_stack_frames = "deny"
needless_pass_by_ref_mut = "deny"
boxed_local = "deny"

# Pointers, casts, and raw memory
ptr_eq = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
borrow_deref_ref = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
as_ptr_cast_mut = "deny"
uninit_vec = "deny"
mem_forget = "deny"
drop_non_drop = "deny"
manual_swap = "deny"
mem_replace_option_with_none = "deny"
manual_c_str_literals = "deny"
string_lit_as_bytes = "deny"

# Concurrency, async, and drop scope
arc_with_non_send_sync = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
declare_interior_mutable_const = "deny"
future_not_send = "deny"
async_yields_async = "deny"
await_holding_lock = "deny"
unused_async = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
mut_mutex_lock = "deny"

# Control flow and redundant code
or_fun_call = "deny"
unnecessary_unwrap = "deny"
unnecessary_wraps = "deny"
if_same_then_else = "deny"
equatable_if_let = "deny"
useless_conversion = "deny"
redundant_locals = "deny"
bool_comparison = "deny"
collapsible_if = "deny"
collapsible_match = "deny"

# Syntax and style
needless_raw_string_hashes = "deny"
trait_duplication_in_bounds = "deny"
unnecessary_self_imports = "deny"
manual_is_ascii_check = "deny"
manual_is_finite = "deny"
manual_is_infinite = "deny"
manual_saturating_arithmetic = "deny"
manual_bits = "deny"
cmp_null = "deny"
