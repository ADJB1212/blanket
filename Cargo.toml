[workspace]
members = [
    "crates/core",
    "crates/codecs",
    "crates/codec-common",
    "crates/codec-png",
    "crates/codec-image",
    "crates/codec-jpeg",
    "crates/codec-jxl",
    "crates/codec-heif",
    "crates/codec-pdf",
    "crates/codec-tiff",
    "crates/codec-webp",
    "crates/codec-avif",
    "crates/codec-bmp-ico",
    "crates/codec-gif",
    "crates/compressor",
    "crates/ops",
    "crates/composite",
    "crates/enhance",
    "crates/filter",
    "crates/palette",
    "crates/stat",
    "crates/blanket",
]
resolver = "3"

[workspace.package]
version = "0.0.3"
authors = ["Andrew Jaffe <adjaffeb@gmail.com>"]
license = "MIT"
repository = "https://github.com/ADJB1212/blanket"
rust-version = "1.97"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 1
debug = "line-directives-only"
lto = "off"
codegen-units = 256

[workspace.lints.clippy]
needless_return = "allow"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
iter_overeager_cloned = "deny"
map_clone = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_enum_variant = "deny"
large_stack_frames = "deny"
vec_init_then_push = "deny"
format_collect = "deny"
manual_memcpy = "deny"
clone_on_copy = "deny"
useless_conversion = "deny"
redundant_locals = "deny"
ptr_eq = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
unnecessary_unwrap = "deny"
clone_on_ref_ptr = "deny"
if_same_then_else = "deny"