[workspace]
members = [
    "crates/core",
    "crates/codecs",
    "crates/codec-common",
    "crates/codec-png",
    "crates/codec-image",
    "crates/codec-jpeg",
    "crates/codec-jxl",
    "crates/codec-heif",
    "crates/codec-pdf",
    "crates/codec-tiff",
    "crates/codec-webp",
    "crates/codec-avif",
    "crates/codec-bmp-ico",
    "crates/codec-gif",
    "crates/codec-extended",
    "crates/codec-jpeg2000",
    "crates/compressor",
    "crates/ops",
    "crates/composite",
    "crates/enhance",
    "crates/filter",
    "crates/palette",
    "crates/stat",
    "crates/draw",
    "crates/blanket",
]
resolver = "3"

[workspace.package]
version = "0.0.6"
authors = ["Andrew Jaffe <adjaffeb@gmail.com>"]
license = "MIT"
repository = "https://github.com/ADJB1212/blanket"
rust-version = "1.98"
edition = "2024"

[workspace.dependencies]
blanket-codec-common = { path = "crates/codec-common" }
blanket-codec-extended = { path = "crates/codec-extended" }
blanket-codec-image = { path = "crates/codec-image" }
blanket-codec-jpeg = { path = "crates/codec-jpeg" }
blanket-codec-jpeg2000 = { path = "crates/codec-jpeg2000" }
blanket-codec-png = { path = "crates/codec-png" }
blanket-codecs = { path = "crates/codecs" }
blanket-core = { path = "crates/core" }
blanket-ops = { path = "crates/ops" }
rayon = { version = "1", default-features = false }
pyo3 = { version = "0.30", features = ["nightly"] }
png = { version = "0.18", default-features = false, features = ["zlib-rs"] }
turbojpeg = { version = "1", default-features = false, features = ["cmake", "require-simd"] }
rustc-hash = { version = "2", default-features = false, features = ["std", "nightly"] }

[profile.release]
opt-level = 3
debug = false
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
incremental = true
opt-level = 1
debug = "line-directives-only"
split-debuginfo = "unpacked"
lto = "off"
codegen-units = 256

[profile.test]
incremental = true
opt-level = 1
debug = "line-directives-only"
split-debuginfo = "unpacked"
lto = "off"
codegen-units = 256

[workspace.lints.rust]
warnings = { level = "deny", priority = -1 }
unused_mut = "deny"
unused_assignments = "deny"
unreachable_pub = "deny"
unused_imports = "deny"
unused_macros = "deny"

[workspace.lints.clippy]
needless_return = "allow"
perf = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
redundant_clone = "deny"
unnecessary_to_owned = "deny"
needless_collect = "deny"
or_fun_call = "deny"
assigning_clones = "deny"
implicit_clone = "deny"
iter_overeager_cloned = "deny"
map_clone = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
large_enum_variant = "deny"
large_stack_frames = "deny"
vec_init_then_push = "deny"
format_collect = "deny"
manual_memcpy = "deny"
clone_on_copy = "deny"
useless_conversion = "deny"
redundant_locals = "deny"
ptr_eq = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"
borrow_as_ptr = "deny"
unnecessary_unwrap = "deny"
clone_on_ref_ptr = "deny"
if_same_then_else = "deny"
mem_forget = "deny"
cast_ptr_alignment = "deny"
transmute_ptr_to_ptr = "deny"
as_ptr_cast_mut = "deny"
drop_non_drop = "deny"
uninit_vec = "deny"
boxed_local = "deny"
arc_with_non_send_sync = "deny"
manual_swap = "deny"
mem_replace_option_with_none = "deny"
manual_c_str_literals = "deny"
vec_box = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
string_lit_as_bytes = "deny"
rc_clone_in_vec_init = "warn"
rc_mutex = "deny"
needless_pass_by_ref_mut = "deny"
needless_raw_string_hashes = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
expl_impl_clone_on_copy = "deny"
future_not_send = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
equatable_if_let = "deny"
collection_is_never_read = "deny"
copy_iterator = "deny"
async_yields_async = "deny"
await_holding_lock = "deny"
trait_duplication_in_bounds = "deny"
tuple_array_conversions = "deny"
unnecessary_self_imports = "deny"
unnecessary_wraps = "deny"
unused_async = "deny"
declare_interior_mutable_const = "deny"
