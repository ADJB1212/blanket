[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "blanket"
description = "A Rust-backed image library with a Pillow-shaped Python API"
readme = "README.md"
authors = [{ name = "Andrew Jaffe", email = "adjaffeb@gmail.com" }]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]


[project.urls]
Repository = "https://github.com/ADJB1212/blanket"

[project.optional-dependencies]
test = [
    "numpy>=2.5",
    "Pillow>=12.3.0",
    "pillow-jxl-plugin>=1.3.8",
    "pillow-heif>=1.7",
    "pytest>=9,<10",
    "rich>=15",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1",
]

[tool.maturin]
python-source = "python"
module-name = "blanket._blanket"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--color=no", "--code-highlight=no", "--no-header", "--tb=line", "--strict-markers", "--strict-config", "--assert=plain"]
console_output_style = "none"
xfail_strict = true

[tool.ruff]
fix = true
line-length = 200
target-version = "py312"

[tool.ruff.lint]
extend-select = ["TID", "RUF", "PERF", "E", "UP", "PIE", "ISC", "C4", "FLY", "B", "F", "Q"]
ignore = ["F401", "N999", "TRY004", "B023", "BLE001", "E501", "C901", "E402"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.isort]
known-first-party = ["blanket"]
split-on-trailing-comma = false
combine-as-imports = true

[tool.ty.src]
exclude = ["scripts", "tests", "docs"]

[tool.ty.environment]
python = "./.venv"

[tool.ty.analysis]
allowed-unresolved-imports = ["blanket._blanket"]

[tool.ty.rules]
invalid-assignment = "ignore"
missing-argument = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-subscriptable = "ignore"
call-non-callable = "ignore"
not-iterable = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"

[tool.uv]
compile-bytecode = true
upgrade = true
