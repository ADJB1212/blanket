[project]
name = "pyblanket"
import-names = ["blanket"]
description = "A Rust-backed image library with a Pillow-shaped Python API"
readme = "README.md"
authors = [{ name = "Andrew Jaffe", email = "adjaffeb@gmail.com" }]
requires-python = ">=3.12"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dynamic = ["version", "license"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Repository = "https://github.com/ADJB1212/blanket"
Homepage = "https://adjb1212.github.io/blanket-docs"
Documentation = "https://adjb1212.github.io/blanket-docs"
Releases = "https://github.com/ADJB1212/blanket/releases"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
  {include-group = "test"},
  {include-group = "docs"}
]
test = [
    "numpy>=2.5",
    "Pillow>=12.3.0",
    "pillow-jxl-plugin>=1.3.8",
    "pillow-heif>=1.7",
    "pytest>=9,<10",
    "rich>=15",
]
docs = [
    "mkdocs>=1.5.0,<2",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.30,<1",
]

[tool.maturin]
python-source = "python"
module-name = "blanket._blanket"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--color=no", "--code-highlight=no", "--no-header", "--tb=line", "--strict-markers", "--strict-config", "--assert=plain"]
console_output_style = "none"
xfail_strict = true

[tool.ruff]
fix = true
line-length = 200
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
extend-select = ["I", "E", "B", "F", "Q", "C4", "UP", "ARG", "TID", "RUF", "PIE", "TCH", "SIM", "ISC", "FLY", "PERF", "FURB", "D417"]
ignore = ["F401", "N999", "TRY004", "B023", "BLE001", "E501", "C901", "E402", "SIM108"]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["TCH", "ARG"]
"scripts/**/*.py" = ["TCH", "ARG"]
"python/blanket/Image.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["blanket"]
split-on-trailing-comma = false
combine-as-imports = true

[tool.ty.src]
exclude = ["scripts", "tests", "docs"]

[tool.ty.environment]
python = "./.venv"

[tool.ty.analysis]
allowed-unresolved-imports = ["blanket._blanket"]

[tool.ty.rules]
invalid-assignment = "ignore"
missing-argument = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-subscriptable = "ignore"
call-non-callable = "ignore"
not-iterable = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"

[tool.uv]
compile-bytecode = true
upgrade = true
