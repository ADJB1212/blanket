[project]
name = "pyblanket"
import-names = ["blanket"]
description = "A Rust-backed image library with a Pillow-shaped Python API"
readme = "README.md"
authors = [{ name = "Andrew Jaffe", email = "adjaffeb@gmail.com" }]
requires-python = ">=3.12"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md", "licenses/**/*"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.urls]
Repository = "https://github.com/ADJB1212/blanket"
Homepage = "https://adjb1212.github.io/blanket-docs"
Documentation = "https://adjb1212.github.io/blanket-docs"
Releases = "https://github.com/ADJB1212/blanket/releases"

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
  {include-group = "test"},
  {include-group = "docs"}
]
test = [
    "numpy>=2.5",
    "Pillow>=13.0.0",
    "pillow-jxl-plugin>=1.3.8",
    "pillow-heif>=1.7",
    "pytest>=9,<10",
    "pytest-xdist>=3.8.0",
    "rich>=15",
    "ruff>=0.17.2",
    "ty>=0.0.92",
]
docs = [
    "mkdocs>=1.5.0,<2",
    "mkdocs-material>=9.8",
    "mkdocstrings[python]>=1.0.8,<2",
    "ruff>=0.17.2",
]

[tool.maturin]
manifest-path = "crates/blanket/Cargo.toml"
python-source = "python"
module-name = "blanket._blanket"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--color=no", "--code-highlight=no", "--no-header", "--tb=line", "--strict-markers", "--strict-config", "--assert=plain", "-n=logical"]
console_output_style = "classic"
xfail_strict = true

[tool.ruff]
fix = true
line-length = 200
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
extend-select = ["B", "E", "F", "I", "Q", "S", "C4", "FA", "TC", "UP", "ANN", "ARG", "FLY", "ICN", "ISC", "PIE", "RET", "RUF", "SIM", "TCH", "TID", "D417", "FURB", "PERF"]
ignore = ["B023", "C901", "E402", "E501", "F401", "N999", "BLE001", "SIM108", "TRY004"]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "ARG"]
"scripts/**/*.py" = ["S", "ANN", "ARG"]
"python/blanket/Image.py" = ["S603", "S606", "ARG002"]
"python/blanket/ImageDraw.py" = ["ARG"]
"python/blanket/ImageMath.py" = ["S307"]
"python/blanket/ImagePalette.py" = ["S311"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["blanket"]
split-on-trailing-comma = false
combine-as-imports = true

[tool.ty.src]
exclude = ["scripts", "tests", "docs"]

[tool.ty.environment]
python = "./.venv"

[tool.ty.terminal]
output-format = "concise"

[tool.ty.analysis]
allowed-unresolved-imports = ["blanket._blanket"]

[tool.ty.rules]
invalid-assignment = "ignore"
missing-argument = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-subscriptable = "ignore"
call-non-callable = "ignore"
not-iterable = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"

[tool.uv]
compile-bytecode = true
upgrade = true
