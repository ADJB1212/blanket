[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "blanket"
description = "A Rust-backed image library with a Pillow-shaped Python API"
readme = "README.md"
authors = [{ name = "Andrew Jaffe", email = "adjaffeb@gmail.com" }]
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "numpy>=2.5",
    "Pillow>=12.3.0",
    "pillow-jxl-plugin>=1.3.8",
    "pillow-heif>=1.4",
    "pytest>=9,<10",
    "rich>=15",
]

[tool.maturin]
python-source = "python"
module-name = "blanket._blanket"
features = ["vendored"]

[tool.pytest.ini_options]
testpaths = ["tests"]
console_output_style = "none"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["F401", "N999"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ty.src]
exclude = ["python/blanket", "scripts", "tests"]
