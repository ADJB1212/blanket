[package]
name = "blanket-codecs"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
blanket-core.workspace = true
pyo3.workspace = true
crc32fast = { version = "1", default-features = false, features = ["std", "nightly"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend", "zlib-rs"] }
blanket-codec-common.workspace = true
blanket-codec-png.workspace = true
blanket-codec-jpeg.workspace = true
blanket-codec-jxl = { path = "../codec-jxl" }
blanket-codec-heif = { path = "../codec-heif" }
blanket-codec-pdf = { path = "../codec-pdf" }
blanket-codec-tiff = { path = "../codec-tiff" }
blanket-codec-webp = { path = "../codec-webp" }
blanket-codec-avif = { path = "../codec-avif" }
blanket-codec-bmp-ico = { path = "../codec-bmp-ico" }
blanket-codec-gif = { path = "../codec-gif" }
blanket-codec-extended.workspace = true
blanket-codec-jpeg2000.workspace = true

[features]
default = []
jxl-vendored = ["blanket-codec-jxl/jxl-vendored"]
embedded-libheif = ["blanket-codec-heif/embedded-libheif"]
no-vendored-webp = ["blanket-codec-webp/no-vendored-webp"]

[lib]
doctest = false

[dev-dependencies]
blanket-bench-support.workspace = true
criterion.workspace = true
tempfile = { version = "3", default-features = false }

[[bench]]
name = "io"
harness = false

[lints]
workspace = true
