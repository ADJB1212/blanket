[package]
name = "blanket-codecs"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
blanket-core.workspace = true
pyo3.workspace = true
blanket-metadata.workspace = true
blanket-codec-common.workspace = true
blanket-codec-png.workspace = true
blanket-codec-jpeg.workspace = true
blanket-codec-jxl.workspace = true
blanket-codec-heif.workspace = true
blanket-codec-pdf.workspace = true
blanket-codec-tiff.workspace = true
blanket-codec-webp.workspace = true
blanket-codec-avif.workspace = true
blanket-codec-bmp-ico.workspace = true
blanket-codec-gif.workspace = true
blanket-codec-extended.workspace = true
blanket-codec-jpeg2000.workspace = true

[features]
default = []
jxl-vendored = ["blanket-codec-jxl/jxl-vendored"]
embedded-libheif = ["blanket-codec-heif/embedded-libheif"]
no-vendored-webp = ["blanket-codec-webp/no-vendored-webp"]

[lib]
doctest = false

[dev-dependencies]
blanket-bench-support.workspace = true
criterion.workspace = true
tempfile = { version = "3", default-features = false }

[[bench]]
name = "io"
harness = false

[lints]
workspace = true
