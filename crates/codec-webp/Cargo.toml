[package]
name = "blanket-codec-webp"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
blanket-core.workspace = true
pyo3.workspace = true
blanket-codec-common.workspace = true
blanket-codec-image.workspace = true
image = { version = "0.25", default-features = false, features = ["webp"] }
webpx = { version = "0.4", default-features = false, features = ["animation", "decode", "encode", "std"] }
libwebp-sys = { version = "0.14", default-features = false, features = ["std", "parallel"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["neon"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
libwebp-sys = { version = "0.14", default-features = false, features = ["avx2", "sse41"] }

[features]
default = []
no-vendored-webp = ["libwebp-sys/system-dylib"]

[build-dependencies]
pkg-config = "0.3"

[lib]
doctest = false

[dev-dependencies]
blanket-bench-support.workspace = true
criterion.workspace = true

[[bench]]
name = "codec"
harness = false

[lints]
workspace = true
