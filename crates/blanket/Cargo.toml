[package]
name = "blanket"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[lib]
name = "_blanket"
crate-type = ["cdylib"]
doctest = false

[dependencies]
blanket-codec-extended.workspace = true
blanket-codec-jpeg2000.workspace = true
pyo3.workspace = true
blanket-core.workspace = true
blanket-codecs.workspace = true
blanket-compressor = { path = "../compressor" }
blanket-ops.workspace = true
blanket-composite = { path = "../composite" }
blanket-enhance = { path = "../enhance" }
blanket-filter = { path = "../filter" }
blanket-palette = { path = "../palette" }
blanket-stat = { path = "../stat" }
blanket-draw = { path = "../draw" }

[features]
default = ["no-vendored-webp"]
jxl-vendored = ["blanket-codecs/jxl-vendored"]
embedded-libheif = ["blanket-codecs/embedded-libheif"]
no-vendored-webp = ["blanket-codecs/no-vendored-webp"]
use-system-lcms2 = ["blanket-core/use-system-lcms2"]

[build-dependencies]
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
