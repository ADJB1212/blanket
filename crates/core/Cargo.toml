[package]
name = "blanket-core"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
lcms2 = { version = "6", default-features = false }
lcms2-sys = { version = "4", default-features = false, features = ["static-fallback", "parallel"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rayon = {version = "1.12", default-features = false }

[features]
default = []
use-system-lcms2 = ["lcms2-sys/dynamic"]


[lib]
doctest = false

[lints]
workspace = true
