[package]
name = "blanket-core"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
blanket-kernels.workspace = true
lcms2 = { version = "6", default-features = false }
lcms2-sys = { version = "4", default-features = false, features = ["static-fallback", "parallel"] }
pyo3.workspace = true
rayon.workspace = true
rustc-hash.workspace = true

[features]
default = []
use-system-lcms2 = ["lcms2-sys/dynamic"]


[lib]
doctest = false

[dev-dependencies]
blanket-bench-support.workspace = true
criterion.workspace = true

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "pixels"
harness = false

[lints]
workspace = true
